name: Build rrelayer dev candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/7702-support

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  AWS_ROLE_ARN: arn:aws:iam::314429810762:role/rrelayer-dev-gha
  ECR_REPOSITORY: rrelayer-dev
  ECS_CLUSTER: rrelayer-dev-cluster
  ECS_SERVICE: rrelayer-dev
  ECS_TASK_DEFINITION: deploy/task-definition-dev.json
  ECS_CONTAINER_NAME: rrelayer-dev

jobs:
  deploy:
    name: Build immutable candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.aws-dev
          platforms: linux/arm64
          push: true
          build-args: |
            RRELAYER_CONFIG=deploy/rrelayer-dev.yaml
            SOURCE_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render ECS task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}
          environment-variables: |
            RRELAYER_RELEASE_ID=${{ github.sha }}

      # Deployment consumes the same digest after dev acceptance. Merging source
      # must never start a second, unverified sender or bypass legacy bootstrap.
      - name: Save promotion identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
          TASK_FILE: ${{ steps.render-task.outputs.task-definition }}
        run: |
          python3 - <<'PYTHON'
          import json, os, shutil
          shutil.copyfile(os.environ['TASK_FILE'], 'candidate-task-definition.json')
          with open('candidate.json', 'w') as f:
              json.dump({'source':os.environ['SOURCE_SHA'], 'image_digest':os.environ['IMAGE_DIGEST'], 'protocol':1, 'accepted':False}, f)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: rrelayer-candidate-${{ github.sha }}
          path: |
            candidate.json
            candidate-task-definition.json
